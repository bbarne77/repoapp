<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>IPAWorld App</title>
  <link rel="stylesheet" href="style.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Firebase Compat SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
</head>
<body>

  <header class="header">
    <div class="header-content">
      <div class="logo">IPAWorld App</div>
    </div>
  </header>

  <main class="main-content">
    <!-- Поисковая строка (только для вкладки Search) -->
    <div id="searchContainer" class="search-container" style="display: none;">
      <input type="text" id="searchInput" placeholder="Поиск по названию..." class="search-input">
    </div>

    <div class="app-list" id="appList">
      <div class="loading" id="loading">Загрузка приложений...</div>
    </div>
  </main>

  <!-- Модальное окно -->
  <div id="appModal" class="modal">
    <div class="modal-content">
      <span class="close-modal" id="closeModal">×</span>

      <!-- Верхняя часть: иконка + название + версия/размер справа от иконки -->
      <div class="modal-top">
        <img id="modalIcon" src="" alt="Иконка" class="modal-icon">
        <div class="modal-title-section">
          <h2 id="modalTitle"></h2>
          <div class="meta-block">
            <div class="meta-item">
              <svg class="meta-icon version-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m18 0h-2M5 12H3m18 0h-2M5 15H3m18 0h-2M5 18H3m18 0h-2M5 21H3m18 0h-2M12 3v2M12 19v2M12 5a7 7 0 0 0-7 7 7 7 0 0 0 7 7 7 7 0 0 0 7-7 7 7 0 0 0-7-7z"/>
              </svg>
              <span id="modalVersion" class="meta-value"></span>
            </div>
            <div class="meta-item">
              <svg class="meta-icon size-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2v20M2 12h20"/>
              </svg>
              <span id="modalSize" class="meta-value"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="modal-body">
        <!-- Блок функций -->
        <div class="features-block">
          <p id="modalFeatures"></p>
        </div>

        <!-- Предупреждение о сертификате -->
        <div class="cert-warning">
          <div class="warning-icon">⚠️</div>
          <div class="warning-text">
            <p>Для установки IPA-файла требуется действующий сертификат разработчика — без него приложение не запустится.</p>
          </div>
        </div>
      </div>

      <div class="modal-buttons">
        <a id="modalDownloadBtn" href="#" class="btn-install" target="_blank" rel="noopener noreferrer">
          Установить
        </a>
        <a href="https://ipaworld.info/" class="btn-buy-cert" target="_blank" rel="noopener noreferrer">
          Купить сертификат
        </a>
      </div>
    </div>
  </div>

  <!-- Нижняя навигация -->
  <nav class="bottom-nav">
    <a href="#" class="tab-item active" data-tab="apps">
      <img src="https://img.icons8.com/ios/50/ffffff/apps.png" alt="Apps" class="tab-icon">
      <span>Apps</span>
    </a>
    <a href="#" class="tab-item" data-tab="games">
      <img src="https://img.icons8.com/ios/50/ffffff/game-controller.png" alt="Games" class="tab-icon">
      <span>Games</span>
    </a>
    <a href="#" class="tab-item" data-tab="search">
      <img src="https://img.icons8.com/ios/50/ffffff/search--v1.png" alt="Search" class="tab-icon">
      <span>Search</span>
    </a>
    <a href="#" class="tab-item" data-tab="info">
      <img src="https://img.icons8.com/ios/50/ffffff/info--v1.png" alt="Info" class="tab-icon">
      <span>Info</span>
    </a>
  </nav>

  <script src="script.js"></script>
</body>
</html>
